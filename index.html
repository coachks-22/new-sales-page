<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeloForge • One App. AI That Actually Coaches You.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .hero-bg { background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://picsum.photos/id/1015/2000/1200') center/cover no-repeat; }
    .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-hover:hover { transform: translateY(-6px); }
  </style>
  <style>
    #confirm-email-error { display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 2rem; background: #09090b; color: #fafafa; }
    html.confirm-email-error #confirm-email-error { display: flex; }
    html.confirm-email-error body > :not(#confirm-email-error) { display: none !important; }
  </style>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var h = new URLSearchParams(location.hash.replace(/^#/, ""));
      function get(k) { return q.get(k) || h.get(k) || ""; }
      var error = get("error");
      var code = get("error_code");
      var desc = get("error_description");
      var blob = (error + " " + code + " " + desc).toLowerCase();
      if (!error && !code && !desc) return;
      if (!/otp_expired|expired|invalid/.test(blob)) return;
      document.documentElement.className += (document.documentElement.className ? " " : "") + "confirm-email-error";
      document.title = "VeloForge • Confirmation link expired";
      document.addEventListener("DOMContentLoaded", function () {
        var el = document.getElementById("confirm-email-error-text");
        if (!el) return;
        var shown = desc ? decodeURIComponent(desc.replace(/\+/g, " ")) : "This confirmation link is expired or invalid.";
        el.textContent = shown + " Open the app and request a new confirmation email.";
      });
    })();
  </script>
</head>
<body class="bg-zinc-950 text-white">
  <main id="confirm-email-error">
    <p id="confirm-email-error-text" style="max-width:28rem;font-size:1.25rem;line-height:1.6;margin:0;"></p>
  </main>
</body>
</html>
